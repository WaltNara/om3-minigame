name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python tests/test_repository.py
      - run: python -m unittest discover -s tools/desktop-prototypes -p 'test_*.py'
